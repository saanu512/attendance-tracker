<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Attendance Tracker</title>
<meta name="theme-color" content="#2A5C54">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body><div id="app"></div>
<script src="app.js" defer></script>
<div id="appAlertOverlay" class="app-alert-overlay" role="dialog" aria-modal="true" aria-labelledby="appAlertTitle">
  <div class="app-alert-box">
    <div id="appAlertTitle" class="app-alert-title">⚠️ Save Roll Number First</div>
    <p id="appAlertMessage" class="app-alert-message">Please save your roll number in Settings before marking or saving attendance.</p>
    <div class="app-alert-actions"><button id="appAlertOk" class="app-alert-ok" type="button" onclick="closeAppAlert()">OK</button></div>
  </div>
</div>

<div id="appDialogOverlay" class="appDialogOverlay" aria-hidden="true">
  <div class="appDialog" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle">
    <h2 id="appDialogTitle" class="appDialogTitle">Confirmation</h2>
    <p id="appDialogMessage" class="appDialogMessage"></p>
    <div class="appDialogActions">
      <button id="appDialogCancel" class="appDialogBtn appDialogCancel" type="button">Cancel</button>
      <button id="appDialogOk" class="appDialogBtn appDialogOk" type="button">OK</button>
    </div>
  </div>
</div>

<div id="activationOverlay" class="activationOverlay" role="dialog" aria-modal="true" aria-labelledby="activationTitle">
  <div class="activationCard">
    <div class="activationIcon">🔒</div>
    <h2 id="activationTitle" class="activationTitle">Activation Required</h2>
    <p class="activationText">Enter the access code to activate this app on this device.</p>
    <input id="activationCode" class="activationInput" type="password" autocomplete="off" placeholder="Enter access code">
    <button id="activationBtn" class="activationBtn" type="button">Activate App</button>
    <div id="activationError" class="activationError"></div>
  </div>
</div>

</body></html>
